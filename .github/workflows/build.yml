name: Build cross-platform

on:
  push:
    tags:
      - "v*"
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: FileConverterPro_macOS
            suffix: ".app"
            asset: dist/FileConverterPro.app
          - os: windows-latest
            artifact: FileConverterPro_Windows
            suffix: ".exe"
            asset: dist/FileConverterPro
          - os: ubuntu-latest
            artifact: FileConverterPro_Linux
            suffix: ""
            asset: dist/FileConverterPro

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript poppler-utils

      - name: System deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ghostscript poppler || true

      - name: Build
        run: python build.py

      - name: Package into zip
        shell: bash
        run: |
          python << 'PYEOF'
          import zipfile, os, sys
          from pathlib import Path
          asset = os.environ["asset"]          # e.g. dist/FileConverterPro.app
          art   = os.environ["artifact"]       # e.g. FileConverterPro_macOS
          src = Path(asset)
          out_dir = Path("dist")
          out_zip = out_dir / f"{art}.zip"
          out_zip.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(out_zip, "w", zipfile.ZIP_DEFLATED) as z:
              if src.is_dir():
                  # Упаковываем содержимое папки (корень записи = содержимое)
                  for p in src.rglob("*"):
                      if p.is_file():
                          z.write(p, p.relative_to(src))
              else:
                  z.write(src, src.name)
          print(f"Created {out_zip} ({out_zip.stat().st_size/1024/1024:.0f} MB)")
          PYEOF
        env:
          artifact: ${{ matrix.artifact }}
          asset: ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      # Публикация в GitHub Release (приватный репозиторий поддерживается)
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
