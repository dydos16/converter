name: Build cross-platform

on:
  push:
    tags:
      - "v*"
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Мак-машин у GitHub мало, задания на них подолгу стоят в очереди. Поэтому macOS собираем
  # только для релизов (теги v*) и при ручном запуске, а на обычных пушах — Windows и Linux.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          win='{"os":"windows-latest","artifact":"FileConverterPro_Windows"}'
          lin='{"os":"ubuntu-latest","artifact":"FileConverterPro_Linux"}'
          mac='{"os":"macos-latest","artifact":"FileConverterPro_macOS"}'
          if [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            list="[$win,$lin,$mac]"
          else
            list="[$win,$lin]"
          fi
          echo "matrix={\"include\":$list}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript poppler-utils
          # Для самопроверки собранного приложения: виртуальный экран и библиотеки Qt (xcb)
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libegl1

      - name: System deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ghostscript poppler || true

      - name: Version
        shell: bash
        run: |
          # Тег v1.2.3 → 1.2.3; обычная сборка с ветки — 0.0.0-dev
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "Версия: $v"

      - name: Build
        run: python build.py

      # В архиве — сама папка приложения, а не её содержимое. ditto и zip -y сохраняют символические
      # ссылки: без них .app на маке распаковывается неполным и с испорченной подписью
      - name: Package into zip
        shell: bash
        run: |
          cd dist
          case "$RUNNER_OS" in
            macOS)   ditto -c -k --keepParent FileConverterPro.app "$artifact.zip" ;;
            Linux)   zip -qry "$artifact.zip" FileConverterPro ;;
            Windows) python -m zipfile -c "$artifact.zip" FileConverterPro ;;
          esac
          echo "Создан $artifact.zip: $(( $(wc -c < "$artifact.zip") / 1048576 )) МБ"
        env:
          artifact: ${{ matrix.artifact }}

      # Сборка может быть «зелёной», а приложение — падать при запуске (PyInstaller не захватил модуль,
      # упаковка потеряла файлы). Проверяем ровно то, что скачают пользователи: распакованный zip.
      - name: Self-test of the app from the zip
        shell: bash
        env:
          artifact: ${{ matrix.artifact }}
        run: |
          out="$RUNNER_TEMP/unzipped"
          case "$RUNNER_OS" in
            Windows) python -m zipfile -e "dist/$artifact.zip" "$out"
                     run=(timeout 300 "$out/FileConverterPro/FileConverterPro.exe") ;;
            Linux)   unzip -q "dist/$artifact.zip" -d "$out"
                     run=(timeout 300 xvfb-run -a "$out/FileConverterPro/FileConverterPro") ;;
            macOS)   ditto -x -k "dist/$artifact.zip" "$out"
                     codesign --verify --deep --strict "$out/FileConverterPro.app"   # подпись цела, иначе шаг упадёт
                     run=(perl -e 'alarm 300; exec @ARGV' "$out/FileConverterPro.app/Contents/MacOS/FileConverterPro") ;;
          esac
          report="$RUNNER_TEMP/selftest.txt"
          set +e
          "${run[@]}" --self-test="$report"
          rc=$?
          set -e
          if [ -f "$report" ]; then cat "$report"; else echo "Отчёта нет — собранное приложение упало при запуске (код $rc)"; fi
          for log in "$APPDATA/FileConverterPro/logs/app.log" "$HOME/.config/file-converter/logs/app.log" \
                     "$HOME/Library/Application Support/FileConverterPro/logs/app.log"; do
            if [ -f "$log" ]; then echo "--- конец лога приложения:"; tail -n 30 "$log"; fi
          done
          exit $rc

      # --- Windows: установщик Inno Setup (для текущего пользователя, без прав администратора)
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=$env:APP_VERSION" packaging\windows\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Item dist\FileConverterPro_Windows_Setup.exe | ForEach-Object { "Установщик: $([math]::Round($_.Length / 1MB)) МБ" }

      - name: Windows installer — install, self-test, uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\FileConverterPro_Windows_Setup.exe `
                 -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode) { "Установщик завершился с кодом $($p.ExitCode)"; exit 1 }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\File Converter Pro'
          $exe = Join-Path $app 'FileConverterPro.exe'
          if (-not (Test-Path $exe)) { "После установки нет $exe"; exit 1 }
          "Установлено в: $app"
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\File Converter Pro.lnk'
          # Запоминаем сейчас: деинсталлятор ниже уберёт ярлык вместе с программой
          $lnkOk = Test-Path $lnk
          "Ярлык в меню «Пуск»: $lnkOk"

          $report = Join-Path $env:RUNNER_TEMP 'installed-selftest.txt'
          $r = Start-Process $exe -ArgumentList "--self-test=$report" -PassThru
          $null = $r.Handle   # без открытого дескриптора PowerShell может потерять код выхода
          if (-not $r.WaitForExit(300000)) { $r.Kill(); "Установленная программа не завершилась за 5 минут"; exit 1 }
          if (Test-Path $report) { Get-Content $report } else { "Отчёта нет — установленная программа упала при запуске" }
          "Код выхода самопроверки: $($r.ExitCode)"

          # Деинсталлятор Inno Setup перезапускает себя из временной папки — ждём, пока исчезнет программа
          Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          "После удаления на диске остались — программа: $(Test-Path $exe), ярлык: $(Test-Path $lnk)"
          if ($r.ExitCode -or -not $lnkOk -or (Test-Path $exe) -or (Test-Path $lnk)) { exit 1 }

      # --- Linux: AppImage — один файл, запускается на большинстве дистрибутивов
      - name: Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p AppDir/usr/lib/fileconverterpro
          cp -r dist/FileConverterPro/. AppDir/usr/lib/fileconverterpro/
          cp packaging/icon.png AppDir/fileconverterpro.png
          cat > AppDir/fileconverterpro.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=File Converter Pro
          Comment=Конвертер документов, PDF и изображений
          Exec=FileConverterPro %F
          Icon=fileconverterpro
          Categories=Office;Utility;
          Terminal=false
          EOF
          # libEGL — часть графического драйвера: Qt без него не стартует. AppImage берёт системный,
          # а этот запасной (диспетчер glvnd, от драйвера не зависит) — только если в системе его нет
          mkdir -p AppDir/usr/lib/fallback
          cp -L /usr/lib/x86_64-linux-gnu/libEGL.so.1 /usr/lib/x86_64-linux-gnu/libGLdispatch.so.0 AppDir/usr/lib/fallback/
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          if ! PATH="$PATH:/sbin:/usr/sbin" ldconfig -p 2>/dev/null | grep -q 'libEGL\.so\.1 '; then
            export LD_LIBRARY_PATH="$HERE/usr/lib/fallback${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          exec "$HERE/usr/lib/fileconverterpro/FileConverterPro" "$@"
          EOF
          chmod +x AppDir/AppRun
          # Закреплённая версия appimagetool, а не плавающая continuous
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir dist/FileConverterPro_Linux.AppImage
          ls -lh dist/FileConverterPro_Linux.AppImage

      - name: Linux AppImage — self-test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Как на сервере без графики: в системе нет libEGL — AppImage должен взять свой запасной
          sudo dpkg -r --force-depends libegl1 > /dev/null
          report="$RUNNER_TEMP/appimage-selftest.txt"
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 300 xvfb-run -a dist/FileConverterPro_Linux.AppImage --self-test="$report"
          rc=$?
          set -e
          if [ -f "$report" ]; then cat "$report"; else echo "Отчёта нет — AppImage упал при запуске (код $rc)"; fi
          exit $rc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        # Переполненная квота хранилища не должна валить сборку и блокировать публикацию релиза
        continue-on-error: true
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/FileConverterPro_Windows_Setup.exe
            dist/FileConverterPro_Linux.AppImage
          if-no-files-found: error
          # Сборки с main нужны ненадолго; релизы по тегам хранятся отдельно в Releases
          retention-days: 7

      # Публикация в GitHub Release (приватный репозиторий поддерживается)
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # zip — переносная версия; установщик (Windows) и AppImage (Linux) — для обычной установки.
          # Файлы, которых нет на этой ОС, просто пропускаются
          files: |
            dist/${{ matrix.artifact }}.zip
            dist/FileConverterPro_Windows_Setup.exe
            dist/FileConverterPro_Linux.AppImage
          # generate_release_notes требует доп. endpoint и может дать 403 от GITHUB_TOKEN
          # из-за политик репозитория. Отключаем — Release всё равно создастся.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
